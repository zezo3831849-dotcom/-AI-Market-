{% extends 'base.html' %}

{% block title %}إضافة مناسبة موسمية | {{ system_settings.store_name }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 shadow-sm" style="max-width: 700px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-calendar-plus text-success me-2"></i> إضافة مناسبة / موسم جديد</h4>
        <a href="{% url 'intelligence:calendar_events' %}" class="btn btn-outline-secondary btn-sm">العودة</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label small fw-bold">اسم المناسبة أو الموسم <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" placeholder="مثال: شهر رمضان المبارك، الجمعة البيضاء..." required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">نوع المناسبة</label>
                <select name="event_type" class="form-select">
                    <option value="RELIGIOUS">مناسبة دينية (رمضان، الأعياد)</option>
                    <option value="SEASON">موسم مناخي (صيف، شتاء)</option>
                    <option value="ACADEMIC">موسم دراسي (المدارس، الجامعات)</option>
                    <option value="COMMERCIAL">موسم تجاري (تخفيضات)</option>
                    <option value="LOCAL">مناسبة محلية</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold">تاريخ البداية <span class="text-danger">*</span></label>
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">تاريخ النهاية <span class="text-danger">*</span></label>
                <input type="date" name="end_date" class="form-control" required>
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold">الفئات الأكثر طلباً وتأثراً</label>
                <div class="row g-2">
                    {% for c in categories %}
                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="target_categories" value="{{ c.id }}" id="cat_{{ c.id }}">
                            <label class="form-check-label small" for="cat_{{ c.id }}">{{ c.name }}</label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold">وصف المناسبة والتأثير المتوقع</label>
                <textarea name="description" class="form-control" rows="2" placeholder="وصف السلع التي يتضاعف سحبها..."></textarea>
            </div>

            <div class="col-12">
                <div class="form-check form-switch mt-1">
                    <input class="form-check-input" type="checkbox" name="recurring_yearly" id="recurringCheck" checked>
                    <label class="form-check-label small fw-bold" for="recurringCheck">مناسبة سنوية متكررة</label>
                </div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-success fw-bold px-4 py-2 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> حفظ المناسبة
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
