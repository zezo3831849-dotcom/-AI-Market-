{% extends 'base.html' %}

{% block title %}{{ title }} | {{ system_settings.store_name }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 shadow-sm" style="max-width: 750px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-truck text-primary me-2"></i> {{ title }}</h4>
        <a href="{% url 'suppliers:suppliers_list' %}" class="btn btn-outline-secondary btn-sm">العودة</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label small fw-bold">اسم الشركة أو المورد <span class="text-danger">*</span></label>
                <input type="text" name="company_name" class="form-control" value="{{ supplier.company_name|default:'' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">اسم المندوب المسؤول</label>
                <input type="text" name="rep_name" class="form-control" value="{{ supplier.rep_name|default:'' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold">رقم الهاتف <span class="text-danger">*</span></label>
                <input type="text" name="phone" class="form-control" value="{{ supplier.phone|default:'' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">رقم هاتف إضافي / واتساب</label>
                <input type="text" name="secondary_phone" class="form-control" value="{{ supplier.secondary_phone|default:'' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" value="{{ supplier.email|default:'' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">العنوان أو المقر</label>
                <input type="text" name="address" class="form-control" value="{{ supplier.address|default:'' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label small fw-bold">مهلة تجهيز وتسليم الطلب (بالأيام)</label>
                <input type="number" name="lead_time_days" class="form-control" value="{{ supplier.lead_time_days|default:'2' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">الحد الأدنى لقيمة الطلب (ج.م)</label>
                <input type="number" step="0.01" name="min_order_value" class="form-control" value="{{ supplier.min_order_value|default:'0.00' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">تقييم الالتزام (من 5)</label>
                <input type="number" step="0.1" name="rating" class="form-control" min="1" max="5" value="{{ supplier.rating|default:'5.0' }}">
            </div>

            <div class="col-md-12">
                <label class="form-label small fw-bold">شروط الدفع والتوريد</label>
                <input type="text" name="payment_terms" class="form-control" value="{{ supplier.payment_terms|default:'نقدي عند الاستلام' }}">
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold">ملاحظات عامة</label>
                <textarea name="notes" class="form-control" rows="2">{{ supplier.notes|default:'' }}</textarea>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary fw-bold px-4 py-2 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> حفظ بيانات المورد
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
