{% extends 'base.html' %}

{% block title %}بدء جلسة جرد جديدة | {{ system_settings.store_name }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 shadow-sm" style="max-width: 600px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-clipboard-plus text-primary me-2"></i> بدء جلسة جرد جديدة</h4>
        <a href="{% url 'inventory:counts_list' %}" class="btn btn-outline-secondary btn-sm">العودة</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label small fw-bold">المخزن المراد جرده <span class="text-danger">*</span></label>
            <select name="warehouse" class="form-select" required>
                {% for w in warehouses %}
                <option value="{{ w.id }}">{{ w.name }} ({{ w.code }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold">ملاحظات الجرد</label>
            <textarea name="notes" class="form-control" rows="3" placeholder="مثال: جرد نهاية شهر أكتوبر، تدقيق عينات الألبان والأجبان..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary fw-bold w-100 py-2 shadow-sm">
            <i class="bi bi-play-circle me-1"></i> إنشاء جلسة الجرد والتقاط الأرصدة الدفترية
        </button>
    </form>
</div>
{% endblock %}
