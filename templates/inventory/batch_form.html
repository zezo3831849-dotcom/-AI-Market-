{% extends 'base.html' %}

{% block title %}إيداع دفعة شراء جديدة | {{ system_settings.store_name }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 shadow-sm" style="max-width: 750px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-calendar-plus text-primary me-2"></i> إيداع دفعة شراء جديدة</h4>
        <a href="{% url 'inventory:batches_list' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-right"></i> العودة للقائمة
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label small fw-bold">المنتج <span class="text-danger">*</span></label>
                <select name="product" class="form-select" required>
                    <option value="">-- اختر المنتج --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} (كود: {{ p.code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">المخزن المستلم <span class="text-danger">*</span></label>
                <select name="warehouse" class="form-select" required>
                    {% for w in warehouses %}
                    <option value="{{ w.id }}">{{ w.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small fw-bold">رقم الدفعة / التشغيلة <span class="text-danger">*</span></label>
                <input type="text" name="batch_number" class="form-control" placeholder="مثال: BATCH-2026-X" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">الكمية المستلمة <span class="text-danger">*</span></label>
                <input type="number" step="0.01" name="quantity" class="form-control" min="0.01" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">سعر الشراء الفعلي للوحدة (ج.م) <span class="text-danger">*</span></label>
                <input type="number" step="0.01" name="cost_price" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label class="form-label small fw-bold">تاريخ الاستلام</label>
                <input type="date" name="received_date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">تاريخ انتهاء الصلاحية</label>
                <input type="date" name="expiry_date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">المورد المورد للدفعة</label>
                <select name="supplier" class="form-select">
                    <option value="">-- بدون تحديد --</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.company_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary fw-bold px-4 py-2 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> إيداع الدفعة في المخزن
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
