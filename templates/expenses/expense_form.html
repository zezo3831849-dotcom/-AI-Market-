{% extends 'base.html' %}

{% block title %}{{ title }} | {{ system_settings.store_name }}{% endblock %}

{% block content %}
<div class="card card-custom p-4 shadow-sm" style="max-width: 750px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-cash-stack text-danger me-2"></i> {{ title }}</h4>
        <a href="{% url 'expenses:expenses_list' %}" class="btn btn-outline-secondary btn-sm">العودة</a>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label small fw-bold">بيان / اسم المصروف <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" value="{{ expense.title|default:'' }}" placeholder="مثال: فاتورة كهرباء شهر أكتوبر 2026..." required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">تصنيف المصروف <span class="text-danger">*</span></label>
                <select name="category" class="form-select" required>
                    <option value="">-- اختر التصنيف --</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}" {% if expense.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small fw-bold">المبلغ الإجمالي (ج.م) <span class="text-danger">*</span></label>
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount|default:'' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">تاريخ المصروف <span class="text-danger">*</span></label>
                <input type="date" name="expense_date" class="form-control" value="{{ expense.expense_date|date:'Y-m-d'|default:'' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">تاريخ الاستحقاق (إن وجد)</label>
                <input type="date" name="due_date" class="form-control" value="{{ expense.due_date|date:'Y-m-d'|default:'' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold">الفترة التي يغطيها المصروف</label>
                <input type="text" name="period_covered" class="form-control" value="{{ expense.period_covered|default:'' }}" placeholder="مثال: شهر أكتوبر 2026">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">الجهة أو الشخص المستفيد</label>
                <input type="text" name="payee" class="form-control" value="{{ expense.payee|default:'' }}" placeholder="مثال: شركة الكهرباء / مالك العقار / موظفي الفرع">
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold">طريقة الدفع</label>
                <select name="payment_method" class="form-select">
                    <option value="CASH" {% if expense.payment_method == 'CASH' %}selected{% endif %}>نقداً (خزينة المحل)</option>
                    <option value="BANK" {% if expense.payment_method == 'BANK' %}selected{% endif %}>تحويل بنكي</option>
                    <option value="CARD" {% if expense.payment_method == 'CARD' %}selected{% endif %}>بطاقة ائتمان / مدفوعات إلكترونية</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">رقم الفاتورة أو الإيصال</label>
                <input type="text" name="invoice_number" class="form-control" value="{{ expense.invoice_number|default:'' }}" placeholder="رقم المستند...">
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold">صورة الإيصال أو المستند (اختياري)</label>
                <input type="file" name="receipt_image" class="form-control">
            </div>

            {% if not expense %}
            <div class="col-12">
                <div class="form-check form-switch mt-2">
                    <input class="form-check-input" type="checkbox" name="is_paid_now" id="paidNowCheck" checked>
                    <label class="form-check-label fw-bold small" for="paidNowCheck">تم سداد هذا المبلغ بالكامل الآن من الخزينة</label>
                </div>
            </div>
            {% endif %}

            <div class="col-12">
                <label class="form-label small fw-bold">ملاحظات إضافية</label>
                <textarea name="notes" class="form-control" rows="2">{{ expense.notes|default:'' }}</textarea>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-danger fw-bold px-4 py-2 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> حفظ المصروف التشغيلي
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
